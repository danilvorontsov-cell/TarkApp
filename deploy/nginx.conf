# ==========================================
# TarkApp Nginx Reverse Proxy & Static Landing
# Zone VPS: uvn-235-67.ams01.zonevs.eu
# ==========================================

# Rate limiting zone for API protection
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name uvn-235-67.ams01.zonevs.eu localhost _;

    # ACME-challenge for Let's Encrypt certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Max upload size for high-resolution textbook photos
    client_max_body_size 25M;

    # Gzip compression for text, svg, js, json, css
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Landing Page Root
    location / {
        root /var/www/landing;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static images and fonts
        location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }

    # 2. FastAPI Endpoints (/api/v1/...)
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Extended timeouts for Gemini OCR & lesson analysis
        proxy_connect_timeout 15s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 3. Healthcheck ping endpoint
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 4. Interactive API Documentation (FastAPI Swagger & OpenAPI)
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Static generated TTS audio files
    location /static/audio/ {
        proxy_pass http://backend_upstream/static/audio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
