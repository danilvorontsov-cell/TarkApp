<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TarkApp — AI-õpiabiline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0c1815;
            color: #f1f5f9;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            padding: 40px 24px;
            background: #152722;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid #23433a;
        }
        h1 {
            color: #2dd4bf;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            background: rgba(45, 212, 191, 0.15);
            color: #2dd4bf;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(45, 212, 191, 0.35);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Closed Beta</div>
        <h1>TarkApp</h1>
        <p>Nutikas AI-õpiabiline koolilastele. Valmistume peagi avalikuks avamiseks!</p>
    </div>
</body>
</html>
