server {
    server_name tarkapp.ee www.tarkapp.ee;

    root /var/www/tarkapp.ee/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.tarkapp.ee/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.tarkapp.ee/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.tarkapp.ee) {
        return 301 https://$host$request_uri;
    }

    if ($host = tarkapp.ee) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name tarkapp.ee www.tarkapp.ee;
    return 404;
}
