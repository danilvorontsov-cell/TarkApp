services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tarkapp-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./backend/static/audio/cache:/app/static/audio/cache
