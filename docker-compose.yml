services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tarkapp-backend
    restart: always
    environment:
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./backend/static:/app/static
